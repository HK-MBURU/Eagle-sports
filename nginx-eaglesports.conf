# ─── HTTP → HTTPS redirect ───────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name eaglesports.co.ke www.eaglesports.co.ke;

    # Let certbot serve its ACME challenge before we redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS main server ───────────────────────────────────────────────────────
# NOTE: certbot --nginx will fill in the ssl_certificate paths below.
# Run:  certbot --nginx -d eaglesports.co.ke -d www.eaglesports.co.ke
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name eaglesports.co.ke www.eaglesports.co.ke;

    # ── SSL — filled in by certbot ──
    # ssl_certificate     /etc/letsencrypt/live/eaglesports.co.ke/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/eaglesports.co.ke/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ──
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options            "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options     "nosniff"                             always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"     always;

    # ── Gzip ──
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # ── ACME challenge (for renewals) ──
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # ── Laravel API ──
    location /api/ {
        proxy_pass         http://127.0.0.1:8120;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    # ── Laravel admin panel ──
    location /admin {
        proxy_pass         http://127.0.0.1:8120;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        client_max_body_size 20M;
    }

    # ── Laravel storage (images, uploads) ──
    location /storage/ {
        proxy_pass       http://127.0.0.1:8120;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # ── React SPA ──
    location / {
        proxy_pass         http://127.0.0.1:8121;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header   Connection        '';
        proxy_read_timeout 30s;
        client_max_body_size 20M;
    }
}
